# 这里的坐标是 [x, y]，以 base_link 中心为原点
footprint: [[-0.15, -0.1], [-0.15, 0.1], [0.15, 0.1], [0.15, -0.1]]
footprint_padding: 0.03 
#障碍物配置
obstacle_range: 2.0
raytrace_range: 2.5
#传感器
observation_sources: laser_scan_sensor
laser_scan_sensor: {sensor_frame: lidar_link, data_type: LaserScan, topic: scan, marking: true, clearing: true}

# 膨胀层
inflation_layer:
  enabled:              true
  cost_scaling_factor:  2.0   # 允许在窄路穿行
  inflation_radius:     0.4  # 缓冲区半径